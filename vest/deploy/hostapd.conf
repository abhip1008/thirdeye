# The vest's own Wi-Fi network.
#
# The phone joins this and nothing else. There is no uplink, no route to the
# internet, and nothing else on it - which is most of why a match runs with no
# network at all.
#
# Copy to /etc/hostapd/hostapd.conf.

interface=wlan0
driver=nl80211

ssid=thirdeye-vest-01
# Change this. It is printed on the vest's pairing code, and anyone standing
# near the umpire can photograph that, which is exactly why Phase 5 signs
# requests rather than relying on the passphrase alone.
wpa_passphrase=change-me-before-a-real-match

hw_mode=a
channel=36
ieee80211n=1
ieee80211ac=1
wmm_enabled=1
ht_capab=[HT40+][SHORT-GI-20][SHORT-GI-40]
vht_oper_chwidth=1
vht_oper_centr_freq_seg0_idx=42

# 5 GHz matters more than it looks. A club ground on a Saturday has two hundred
# phones on 2.4 GHz and the clip transfer has to fit in the gap between balls.
# If the radio cannot do 5 GHz AP mode, the throughput budget is at risk - check
# with scripts/check-hardware.sh before ordering anything.

auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
macaddr_acl=0
ignore_broadcast_ssid=0

country_code=US
