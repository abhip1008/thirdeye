# Addresses for the phone that joins the vest.
#
# Copy to /etc/dnsmasq.d/thirdeye.conf.

interface=wlan0
bind-interfaces

# The vest is always .1, which is what the pairing code carries and what the
# app's transport-security exception names.
dhcp-range=192.168.43.10,192.168.43.60,255.255.255.0,12h
dhcp-option=option:router,192.168.43.1

# No DNS forwarding and no default route off this network. There is nothing to
# reach and nothing should try: a match runs with no internet.
no-resolv
no-hosts
port=0
