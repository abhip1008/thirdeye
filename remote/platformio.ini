; Third Eye remote: two buttons in the umpire's hand.
;
; The ESP32-C3 supports BLE 5.0 and no Bluetooth Classic, so NimBLE is the stack
; on this side. BlueZ, which appears in a lot of notes about this project, is the
; Linux half of the same link and lives on the vest.
[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1
build_flags =
    -DCORE_DEBUG_LEVEL=3
