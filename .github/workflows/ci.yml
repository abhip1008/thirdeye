name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  protocol:
    name: Protocol is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The whole point of the generator: a protocol change that only one side
      # was told about fails here rather than on a Saturday.
      - run: npm run protocol:check

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  vest:
    name: Vest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - run: python -m pytest
