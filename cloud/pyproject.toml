[project]
name = "thirdeye-cloud"
version = "0.1.0"
description = "Optional after-the-match sync for Third Eye. Nothing on match day may depend on it."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]
